name: Sync Index

# 往仓库里放文件（GitHub 网页拖拽上传 / git push），索引自动跟着更新。
# 触发方式三选一：
#   1. push        —— 任何人提交后立刻跑（最可靠，优先走这条）
#   2. 手动        —— Actions 页面点 Run workflow
#   3. 定时兜底    —— 每 20 分钟试一次，就算前两条都没生效也会自己补上
# 扫描范围：Meme/images/**（目录名即分类）和 Word/words/*.txt（文件名即分类）。
# 新增分类不用改代码：建个目录 / 建个 txt，索引里就会自动出现这个分类。

on:
  push:
  workflow_dispatch:
  schedule:
    # ⚠ cron 用的是 UTC，而且**不能用整点**。
    # GitHub 官方文档明说：整点是负载最高的时刻，定时的运行会被延迟，负载过高时**直接丢弃**。
    # 实测验证过：写成 '0 * * * *' 时，15 小时里只跑成 3 次（22:45 / 00:56 / 05:37，全都不在整点）。
    # 所以这里避开整点、并且每小时试 3 次 —— 单次被丢的概率再高，也能保证一小时内至少跑成一次。
    # 分钟数选 7/27/47，都是远离整点的时刻。
    # 说明：这仍然只是「兜底」。要立刻生效请用 push 或手动触发。
    - cron: '7,27,47 * * * *'

# 同一时刻只跑一个索引任务，避免两次提交互相覆盖
concurrency:
  group: sync-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # 机器人自己的提交不再触发，避免死循环。
    # 注意：定时任务必须放行，所以这层判断只对 push 事件生效。
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 扫描并同步索引
        run: node scripts/sync-index.mjs --write

      - name: 提交变更
        run: |
          git config user.name  "cy-chat-bot"
          git config user.email "cy-chat-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "索引已是最新，没有需要提交的改动。"
            exit 0
          fi
          git add -A
          git commit -m "chore(index): 自动同步索引 [skip-sync]"
          git push
