name: CI Probe

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 报告触发信息
        run: |
          echo "触发器 = ${{ github.event_name }}"
          echo "分支   = ${{ github.ref }}"
          echo "提交   = ${{ github.sha }}"
